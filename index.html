<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ledger</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #000000;
    --surface: #0E1115;
    --surface-2: #0E1115;
    --border: #232B37;
    --text: #E7EAEE;
    --text-dim: #7C8798;
    --text-faint: #4B5563;
    --accent: #D8A857;
    --accent-dim: #8A6F3F;
    --positive: #5CB98C;
    --positive-dim: #3A6E56;
    --negative: #D9776B;
    --negative-dim: #7A4038;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px) 0;
    max-width: 480px;
    margin: 0 auto;
  }
  .wrap { padding: 20px 18px 0; }

  /* Hero */
  .hero {
    padding: 10px 4px 22px;
    margin-bottom: 22px;
  }
  .hero-num {
    font-family: var(--mono);
    font-size: 75px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
  }
  .hero-num.neg { color: var(--negative); }
  .hero-num.pos { color: var(--text); }
  .hero-sub {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 12px 0 0;
    line-height: 1.6;
  }
  .hero-sub .amt { color: var(--text); }
  .hero-sub .fpart { white-space: nowrap; }
  .hero-rule {
    height: 1px;
    background: linear-gradient(90deg, var(--accent-dim), transparent);
    margin-top: 18px;
  }

  /* Section cards */
  .section { margin-bottom: 20px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .section-title {
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  /* Input grid for Position section */
  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .input-cell {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .input-cell:nth-child(2n) { border-right: none; }
  .input-cell:nth-last-child(-n+2) { border-bottom: none; }
  .input-cell label {
    display: block;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .input-cell input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 17px;
    padding: 0;
    outline: none;
  }
  .input-cell input::placeholder { color: var(--text-faint); }
  .check-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 14px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    position: relative;
  }
  .check-row span:first-child {
    font-size: 14px;
    color: var(--text);
  }
  .check-row input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .check-box {
    width: 40px;
    height: 24px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .check-box::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: transform 0.15s, background 0.15s;
  }
  .check-row input:checked + .check-box {
    background: rgba(216, 168, 87, 0.25);
    border-color: var(--accent-dim);
  }
  .check-row input:checked + .check-box::after {
    transform: translateX(16px);
    background: var(--accent);
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type="number"] {
    -moz-appearance: textfield;
    appearance: textfield;
  }
  .input-cell input.debt-field { color: var(--negative); }

  /* Ledger rows */
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row.locked { background: var(--surface-2); }
  .row.applied { opacity: 0.5; }

  .applied-card { margin-top: 10px; }
  .applied-card:empty { display: none; }

  .row-check {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    padding: 0;
  }
  .row-check.checked {
    background: rgba(216, 168, 87, 0.18);
    border-color: var(--accent-dim);
  }

  .row-label-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row-label {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14.5px;
    padding: 4px 0;
    outline: none;
    text-overflow: ellipsis;
  }
  .row-label::placeholder { color: var(--text-faint); }
  .row-label.static { color: var(--text-dim); }
  .row-tag {
    font-size: 9.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-faint);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    flex-shrink: 0;
  }

  .row-amt {
    width: 80px;
    background: transparent;
    border: none;
    font-family: var(--mono);
    font-size: 14.5px;
    text-align: right;
    padding: 4px 0;
    outline: none;
  }
  .row-amt::placeholder { color: var(--text-faint); }
  .row-amt.pos { color: var(--positive); }
  .row-amt.neg { color: var(--negative); }
  .row-amt.static { color: var(--text-dim); }

  .row-bal {
    width: 78px;
    text-align: right;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .row-bal.neg { color: var(--negative); }

  .row-recur {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-faint);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .row-recur.on {
    background: rgba(216, 168, 87, 0.14);
    border-color: var(--accent-dim);
    color: var(--accent);
  }

  .row-del {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--text-faint);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .row-del:active { color: var(--negative); }

  .add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    color: var(--accent-dim);
    font-size: 13.5px;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }
  .add-row:active { color: var(--accent); }

</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <p class="hero-num" id="heroNum">$0</p>
    <div class="hero-rule"></div>
    <div class="hero-sub" id="heroFormula"><span class="fpart">Position ($0)</span> <span class="fpart">+ Ledger ($0)</span> <span class="fpart">+ Advance ($0)</span></div>
  </div>

  <div class="section">
    <div class="section-head">
      <p class="section-title">Position</p>
    </div>
    <div class="card">
      <div class="input-grid">
        <div class="input-cell">
          <label>Bank balance</label>
          <input type="number" inputmode="decimal" id="inBank" placeholder="0" step="0.01">
        </div>
        <div class="input-cell">
          <label>CC balance</label>
          <input type="number" inputmode="text" id="inCC" placeholder="0" step="0.01" class="debt-field">
        </div>
        <div class="input-cell">
          <label>Savings</label>
          <input type="number" inputmode="decimal" id="inSavings" placeholder="0" step="0.01">
        </div>
        <div class="input-cell">
          <label>Other</label>
          <input type="number" inputmode="text" id="inOther" placeholder="0" step="0.01" class="debt-field">
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <p class="section-title">Ledger</p>
    </div>
    <div class="card" id="ledgerCard"></div>
    <div class="card applied-card" id="appliedCard"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <p class="section-title">Settings</p>
    </div>
    <div class="card">
      <div class="input-grid">
        <div class="input-cell">
          <label>Paycheck</label>
          <input type="number" inputmode="decimal" id="inPaycheck" placeholder="0" step="0.01">
        </div>
        <div class="input-cell">
          <label>Monthly F&amp;G est.</label>
          <input type="number" inputmode="text" id="inFG" placeholder="0" step="0.01" class="debt-field">
        </div>
      </div>
      <label class="check-row" for="inPayIII">
        <span>3rd paycheck this cycle</span>
        <input type="checkbox" id="inPayIII">
        <span class="check-box"></span>
      </label>
    </div>
  </div>

</div>

<script id="app-data" type="application/json">
{
  "position": { "bank": 1500, "cc": -360, "savings": "", "other": "", "paycheck": 2630, "fg": -450 },
  "payIII": false,
  "ledger": [
    { "label": "Mortgage", "amount": -2425, "recurring": true },
    { "label": "HOA", "amount": -390, "recurring": true },
    { "label": "Water", "amount": -65, "recurring": true },
    { "label": "Internet", "amount": -55, "recurring": true },
    { "label": "Electric", "amount": -115, "recurring": true },
    { "label": "Auto Ins.", "amount": -130, "recurring": true },
    { "label": "Gym", "amount": -30, "recurring": true },
    { "label": "Services", "amount": -25, "recurring": true }
  ]
}
</script>

<script>
(function () {
  var STORAGE_KEY = 'ledger-app-state';
  var state;
  var ledgerRowRefs = [];

  function loadState() {
    var embedded = JSON.parse(document.getElementById('app-data').textContent);
    var cached = null;
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) cached = JSON.parse(raw);
    } catch (e) {}
    return cached || embedded;
  }

  function fmt(n) {
    n = Math.round(n + Number.EPSILON);
    var neg = n < 0;
    var abs = Math.abs(n);
    var out = '$' + abs.toLocaleString('en-US', { maximumFractionDigits: 0 });
    return neg ? '-' + out : out;
  }

  // Auto rows (Pay I/II/III, F&G) display as plain signed numbers, like a
  // typed ledger entry, no currency symbol or thousands separator.
  function fmtPlain(n) {
    n = Math.round(n + Number.EPSILON);
    return String(n);
  }

  function num(v) {
    var n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  // Bank/CC take raw typed text so a leading + or - can override the implied sign.
  // defaultNegative=true means a plain number (no sign typed) counts as negative.
  function bankValue() { return num(state.position.bank); }
  function ccValue() { return num(state.position.cc); }
  function savingsValue() { return num(state.position.savings); }
  function otherValue() { return num(state.position.other); }
  function positionTotal() { return bankValue() + ccValue() + savingsValue() + otherValue(); }

  function genRows() {
    var p = state.position;
    var pay = num(p.paycheck);
    var fgHalf = num(p.fg) / 2;
    var applied = state.autoApplied || {};
    var rows = [
      { id: 'payI', label: 'Pay I', amount: pay, locked: true, applied: !!applied.payI },
      { id: 'fg1', label: 'F&G', amount: fgHalf, locked: true, applied: !!applied.fg1 },
      { id: 'payII', label: 'Pay II', amount: pay, locked: true, applied: !!applied.payII },
      { id: 'fg2', label: 'F&G', amount: fgHalf, locked: true, applied: !!applied.fg2 }
    ];
    if (state.payIII) {
      rows.push({ id: 'payIII', label: 'Pay III', amount: pay, locked: true, applied: !!applied.payIII });
      rows.push({ id: 'fg3', label: 'F&G', amount: fgHalf, locked: true, applied: !!applied.fg3 });
    }
    return rows;
  }

  function ledgerEnd() {
    var bal = 0;
    genRows().forEach(function (row) { if (!row.applied) bal += row.amount; });
    state.ledger.forEach(function (row) { if (!row.applied) bal += num(row.amount); });
    return bal;
  }

  function advanceTotal() {
    var p = state.position;
    var t = num(p.paycheck) * 2 + num(p.fg);
    state.ledger.forEach(function (row) {
      if (row.recurring) t += num(row.amount);
    });
    return t;
  }

  // A 2nd advance only requires actual savings in hand right now, not the
  // full Position (Bank + CC too) — Savings alone is what's truly liquid
  // and set aside, not money already earmarked for this month's Ledger.
  function advanceCount() {
    var single = advanceTotal();
    return (savingsValue() > single) ? 2 : 1;
  }

  function roundStep(n, step) {
    return Math.round(n / step) * step;
  }

  function renderPosition() {
    var bankIn = document.getElementById('inBank');
    var ccIn = document.getElementById('inCC');
    var savingsIn = document.getElementById('inSavings');
    var otherIn = document.getElementById('inOther');
    var payIn = document.getElementById('inPaycheck');
    var fgIn = document.getElementById('inFG');
    var payIIIIn = document.getElementById('inPayIII');

    if (document.activeElement !== bankIn) bankIn.value = state.position.bank;
    if (document.activeElement !== ccIn) ccIn.value = state.position.cc;
    if (document.activeElement !== savingsIn) savingsIn.value = state.position.savings;
    if (document.activeElement !== otherIn) otherIn.value = state.position.other;
    if (document.activeElement !== payIn) payIn.value = state.position.paycheck;
    if (document.activeElement !== fgIn) fgIn.value = state.position.fg;
    payIIIIn.checked = !!state.payIII;
  }

  function makeCheckBtn(checked, onToggle) {
    var btn = document.createElement('button');
    btn.className = 'row-check' + (checked ? ' checked' : '');
    btn.textContent = checked ? '\u2713' : '';
    btn.setAttribute('aria-label', 'Already applied to bank balance');
    btn.addEventListener('click', onToggle);
    return btn;
  }

  function buildAutoRow(item, running, showBalance) {
    var row = document.createElement('div');
    row.className = 'row locked' + (item.applied ? ' applied' : '');
    row.appendChild(makeCheckBtn(item.applied, function () {
      var applied = state.autoApplied || (state.autoApplied = {});
      applied[item.id] = !applied[item.id];
      recalcAndRender();
    }));

    var labelWrap = document.createElement('div');
    labelWrap.className = 'row-label-wrap';
    var label = document.createElement('span');
    label.className = 'row-label static';
    label.textContent = item.label;
    var tag = document.createElement('span');
    tag.className = 'row-tag';
    tag.textContent = 'auto';
    labelWrap.appendChild(label);
    labelWrap.appendChild(tag);
    row.appendChild(labelWrap);

    var amt = document.createElement('span');
    amt.className = 'row-amt static';
    amt.textContent = fmtPlain(item.amount);
    row.appendChild(amt);

    if (showBalance) {
      var bal = document.createElement('span');
      bal.className = 'row-bal' + (running < 0 ? ' neg' : '');
      bal.textContent = fmt(running);
      row.appendChild(bal);
    } else {
      var balSpacer = document.createElement('span');
      balSpacer.style.width = '78px';
      balSpacer.style.flexShrink = '0';
      row.appendChild(balSpacer);
    }

    var spacer = document.createElement('span');
    spacer.style.width = '20px';
    spacer.style.flexShrink = '0';
    row.appendChild(spacer);

    return { row: row, balEl: showBalance ? row.querySelector('.row-bal') : null };
  }

  function buildManualRow(item, idx, running, showBalance) {
    var row = document.createElement('div');
    row.className = 'row' + (item.applied ? ' applied' : '');
    row.appendChild(makeCheckBtn(item.applied, function () {
      state.ledger[idx].applied = !state.ledger[idx].applied;
      recalcAndRender();
    }));

    var labelWrap = document.createElement('div');
    labelWrap.className = 'row-label-wrap';
    var label = document.createElement('input');
    label.className = 'row-label';
    label.value = item.label;
    label.placeholder = 'Label';
    label.addEventListener('input', function () {
      state.ledger[idx].label = label.value;
      persist();
    });
    labelWrap.appendChild(label);
    row.appendChild(labelWrap);

    var amt = document.createElement('input');
    amt.className = 'row-amt ' + (num(item.amount) < 0 ? 'neg' : 'pos');
    amt.type = 'number';
    amt.inputMode = 'text';
    amt.step = '0.01';
    amt.value = item.amount;
    amt.placeholder = '0';
    amt.addEventListener('input', function () {
      state.ledger[idx].amount = amt.value;
      updateLedgerCalcs();
    });
    row.appendChild(amt);

    var bal = null;
    if (showBalance) {
      bal = document.createElement('span');
      bal.className = 'row-bal' + (running < 0 ? ' neg' : '');
      bal.textContent = fmt(running);
      row.appendChild(bal);
    } else {
      var balSpacer = document.createElement('span');
      balSpacer.style.width = '78px';
      balSpacer.style.flexShrink = '0';
      row.appendChild(balSpacer);
    }

    var recur = document.createElement('button');
    recur.className = 'row-recur' + (item.recurring ? ' on' : '');
    recur.textContent = '\u21bb';
    recur.setAttribute('aria-label', 'Toggle monthly recurring');
    recur.addEventListener('click', function () {
      state.ledger[idx].recurring = !state.ledger[idx].recurring;
      recalcAndRender();
    });
    row.appendChild(recur);

    var del = document.createElement('button');
    del.className = 'row-del';
    del.textContent = '\u2715';
    del.setAttribute('aria-label', 'Remove line');
    del.addEventListener('click', function () {
      state.ledger.splice(idx, 1);
      recalcAndRender();
    });
    row.appendChild(del);

    return { row: row, balEl: bal, amtEl: amt };
  }

  function renderLedger() {
    var ledgerCard = document.getElementById('ledgerCard');
    var appliedCard = document.getElementById('appliedCard');
    ledgerCard.innerHTML = '';
    appliedCard.innerHTML = '';
    var running = 0;
    ledgerRowRefs = [];

    genRows().forEach(function (item) {
      if (item.applied) {
        var built = buildAutoRow(item, 0, false);
        appliedCard.appendChild(built.row);
      } else {
        running += item.amount;
        var built2 = buildAutoRow(item, running, true);
        ledgerCard.appendChild(built2.row);
        ledgerRowRefs.push({ balEl: built2.balEl });
      }
    });

    state.ledger.forEach(function (item, idx) {
      if (item.applied) {
        var built = buildManualRow(item, idx, 0, false);
        appliedCard.appendChild(built.row);
      } else {
        running += num(item.amount);
        var built2 = buildManualRow(item, idx, running, true);
        ledgerCard.appendChild(built2.row);
        ledgerRowRefs.push({ balEl: built2.balEl, amtEl: built2.amtEl });
      }
    });

    var addBtn = document.createElement('button');
    addBtn.className = 'add-row';
    addBtn.textContent = '+ Add line';
    addBtn.addEventListener('click', function () {
      state.ledger.push({ label: '', amount: '', recurring: false, applied: false });
      recalcAndRender();
      var inputs = ledgerCard.querySelectorAll('.row-label');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    ledgerCard.appendChild(addBtn);

    appliedCard.style.display = appliedCard.children.length ? '' : 'none';
  }

  // Lightweight update for a single amount keystroke: refreshes running
  // balances, sign badges, and totals in place without rebuilding the
  // ledger's DOM, so the input being typed into is never destroyed.
  function updateLedgerCalcs() {
    var running = 0;
    var refIdx = 0;

    genRows().forEach(function (item) {
      if (item.applied) return;
      running += item.amount;
      var ref = ledgerRowRefs[refIdx++];
      if (ref) {
        ref.balEl.textContent = fmt(running);
        ref.balEl.className = 'row-bal' + (running < 0 ? ' neg' : '');
      }
    });

    state.ledger.forEach(function (item) {
      if (item.applied) return;
      var amount = num(item.amount);
      running += amount;
      var ref = ledgerRowRefs[refIdx++];
      if (ref) {
        ref.balEl.textContent = fmt(running);
        ref.balEl.className = 'row-bal' + (running < 0 ? ' neg' : '');
        var neg = amount < 0;
        ref.amtEl.className = 'row-amt ' + (neg ? 'neg' : 'pos');
      }
    });

    renderTotals();
    persist();
  }

  function renderTotals() {
    var pos = positionTotal();
    var le = ledgerEnd();
    var singleAdv = advanceTotal();
    var advCount = advanceCount();
    var at = singleAdv * advCount;
    var total = pos + le + at;
    var roundedTotal = roundStep(total, 50);

    var heroEl = document.getElementById('heroNum');
    heroEl.textContent = fmt(roundedTotal);
    heroEl.className = 'hero-num' + (roundedTotal < 0 ? ' neg' : ' pos');

    var advLabel = '+ Advance (' + fmt(singleAdv) + (advCount === 2 ? ' \u00d72' : '') + ')';
    document.getElementById('heroFormula').innerHTML =
      '<span class="fpart">Position (' + fmt(pos) + ')</span> ' +
      '<span class="fpart">+ Ledger (' + fmt(le) + ')</span> ' +
      '<span class="fpart">' + advLabel + '</span>';
  }

  function recalcAndRender() {
    renderPosition();
    renderLedger();
    renderTotals();
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function bindPosition() {
    document.getElementById('inBank').addEventListener('input', function (e) {
      state.position.bank = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inCC').addEventListener('input', function (e) {
      state.position.cc = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inSavings').addEventListener('input', function (e) {
      state.position.savings = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inOther').addEventListener('input', function (e) {
      state.position.other = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inPaycheck').addEventListener('input', function (e) {
      state.position.paycheck = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inFG').addEventListener('input', function (e) {
      state.position.fg = e.target.value;
      recalcAndRender();
    });
    document.getElementById('inPayIII').addEventListener('change', function (e) {
      state.payIII = e.target.checked;
      recalcAndRender();
    });
  }

  state = loadState();
  renderPosition();
  bindPosition();
  recalcAndRender();
})();
</script>

</body>
</html>
